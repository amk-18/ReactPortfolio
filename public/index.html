    <!-- Inline Critical CSS for Above-the-Fold Content -->
    <style>
      /* Critical CSS for initial render */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        line-height: 1.6;
        color: #1e293b;
        background: #f8fafc;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        width: 100%;
      }
      
      @media (max-width: 768px) {

    <noscript>
      <div style="padding: 20px; text-align: center; background: #fee; color: #c00;">
        ⚠️ JavaScript is disabled. Please enable JavaScript for the best experience.
      </div>
    </noscript>
    
    <div id="root"></div>
    
    <!-- Performance Monitoring -->
    <script>
      // Report Core Web Vitals
      if ('performance' in window && 'getEntriesByType' in performance) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = performance.getEntriesByType('navigation')[0];
            if (perfData) {
              console.log('📊 Performance Metrics:', {
                'TTFB': perfData.responseStart - perfData.requestStart + 'ms',
                'DOM Load': perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart + 'ms',
                'Page Load': perfData.loadEventEnd - perfData.loadEventStart + 'ms'
              });
            }
          }, 0);
        });
      }
      
      // Register Service Worker for offline capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(
            function(registration) {
              console.log('✅ Service Worker registered:', registration.scope);
            },
            function(err) {
              console.log('❌ Service Worker registration failed:', err);
            }
          );
        });
      }
      
      // Handle offline/online events
      window.addEventListener('offline', function() {
        document.body.classList.add('offline');
        console.log('📡 App is offline');
      });
      
      window.addEventListener('online', function() {
        document.body.classList.remove('offline');
        console.log('📡 App is online');
      });
    </script>
